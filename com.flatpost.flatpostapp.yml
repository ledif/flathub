id: com.flatpost.flatpostapp
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: /app/usr/bin/flatpost
build-extensions:
  - org.freedesktop.Sdk.Extension.python3
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-documents
  - --share=network

modules:
  - "python3-modules.json"

  - name: flatpost
    buildsystem: simple
    build-commands:
      - make DESTDIR=/app install
    sources:
      - type: archive
        url: https://github.com/GloriousEggroll/flatpost/archive/refs/tags/1.0.3.zip
        sha256: d0002fa6783626ec4bbefe7cdfb54a6161e9dc14efbc4d613dd8590d68095d43
